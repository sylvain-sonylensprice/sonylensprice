<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SonyLensPrice - Comparateur d'objectifs photo Sony & Tiers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-sans">

    <header class="border-b border-gray-800 bg-gray-900/50 backdrop-blur sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-tight text-orange-500">SonyLens<span class="text-white">Price</span></h1>
            <span class="text-sm text-gray-400">Le comparateur des optiques Sony & Montures E tierces</span>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        
        <div class="mb-8 flex flex-col lg:flex-row gap-4 justify-between items-center">
            <div class="w-full lg:w-80">
                <input type="text" id="searchInput" placeholder="Rechercher (ex: Sigma, Tamron, SEL2470)..." 
                    class="w-full bg-gray-900 border border-gray-800 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-orange-500 transition">
            </div>
            
            <div class="flex flex-wrap gap-4 w-full lg:w-auto justify-between lg:justify-end">
                <div class="flex gap-1.5 bg-gray-900 p-1 border border-gray-800 rounded-lg">
                    <button onclick="filterType('all')" id="btn-type-all" class="px-3 py-1.5 text-xs bg-gray-800 text-white rounded-md transition font-medium">Tous types</button>
                    <button onclick="filterType('zoom')" id="btn-type-zoom" class="px-3 py-1.5 text-xs text-gray-300 hover:text-white rounded-md transition">Zooms</button>
                    <button onclick="filterType('prime')" id="btn-type-prime" class="px-3 py-1.5 text-xs text-gray-300 hover:text-white rounded-md transition">Fixes</button>
                </div>

                <div class="flex gap-1.5 bg-gray-900 p-1 border border-gray-800 rounded-lg">
                    <button onclick="filterBrand('all')" id="btn-brand-all" class="px-3 py-1.5 text-xs bg-gray-800 text-white rounded-md transition font-medium">Toutes marques</button>
                    <button onclick="filterBrand('Sony')" id="btn-brand-Sony" class="px-3 py-1.5 text-xs text-gray-300 hover:text-white rounded-md transition">Sony</button>
                    <button onclick="filterBrand('Sigma')" id="btn-brand-Sigma" class="px-3 py-1.5 text-xs text-gray-300 hover:text-white rounded-md transition">Sigma</button>
                    <button onclick="filterBrand('Tamron')" id="btn-brand-Tamron" class="px-3 py-1.5 text-xs text-gray-300 hover:text-white rounded-md transition">Tamron</button>
                </div>
            </div>
        </div>

        <div class="bg-gray-900 border border-gray-800 rounded-xl overflow-hidden shadow-xl">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-gray-800 text-xs uppercase tracking-wider text-gray-400 bg-gray-900/80">
                            <th class="p-4">Objectif (Réf.)</th>
                            <th class="p-4">Marque</th>
                            <th class="p-4">Type</th>
                            <th class="p-4">Monture</th>
                            <th class="p-4">Capteur</th>
                            <th class="p-4">Ouverture</th>
                            <th class="p-4">Poids</th>
                            <th class="p-4">Neuf</th>
                            <th class="p-4">Occasion</th>
                            <th class="p-4 w-64">Price History (Min / Max)</th>
                            <th class="p-4 text-right">Action</th>
                        </tr>
                    </thead>
                    <tbody id="lensTableBody" class="divide-y divide-gray-800 text-sm">
                        </tbody>
                </table>
            </div>
        </div>

    </main>

    <script>
        const lenses = [
            { 
                name: "Sony FE 24-70mm f/2.8 GM II", 
                brand: "Sony",
                ref: "SEL2470GM2",
                type: "zoom", 
                mount: "FE",
                sensor: "Full-frame",
                aperture: "f/2.8", 
                weight: "695 g", 
                newPrice: "2 299 €",
                usedPrice: "Dès 1 989 €",
                usedState: "Très bon état",
                historyLabels: ['Jan', 'Fév', 'Mar', 'Avr'],
                priceHistory: [2499, 2399, 2350, 2299],
                minPrice: "2 299 € (Avr)",
                maxPrice: "2 499 € (Jan)"
            },
            { 
                name: "Sigma 24-70mm f/2.8 DG DN Art II", 
                brand: "Sigma",
                ref: "303969",
                type: "zoom", 
                mount: "FE",
                sensor: "Full-frame",
                aperture: "f/2.8", 
                weight: "745 g", 
                newPrice: "1 349 €",
                usedPrice: "Dès 1 150 €",
                usedState: "Comme neuf",
                historyLabels: ['Jan', 'Fév', 'Mar', 'Avr'],
                priceHistory: [1399, 1379, 1349, 1349],
                minPrice: "1 349 € (Mar)",
                maxPrice: "1 399 € (Jan)"
            },
            { 
                name: "Tamron 28-75mm f/2.8 Di III VXD G2", 
                brand: "Tamron",
                ref: "A063",
                type: "zoom", 
                mount: "FE",
                sensor: "Full-frame",
                aperture: "f/2.8", 
                weight: "540 g", 
                newPrice: "899 €",
                usedPrice: "Dès 750 €",
                usedState: "Bon état",
                historyLabels: ['Jan', 'Fév', 'Mar', 'Avr'],
                priceHistory: [949, 919, 899, 899],
                minPrice: "899 € (Mar)",
                maxPrice: "949 € (Jan)"
            },
            { 
                name: "Sony FE 50mm f/1.4 GM", 
                brand: "Sony",
                ref: "SEL50F14GM",
                type: "prime", 
                mount: "FE",
                sensor: "Full-frame",
                aperture: "f/1.4", 
                weight: "516 g", 
                newPrice: "1 599 €",
                usedPrice: "Dès 1 390 €",
                usedState: "Comme neuf",
                historyLabels: ['Jan', 'Fév', 'Mar', 'Avr'],
                priceHistory: [1699, 1649, 1599, 1599],
                minPrice: "1 599 € (Mar)",
                maxPrice: "1 699 € (Jan)"
            },
            { 
                name: "Sigma 85mm f/1.4 DG DN Art", 
                brand: "Sigma",
                ref: "316969",
                type: "prime", 
                mount: "FE",
                sensor: "Full-frame",
                aperture: "f/1.4", 
                weight: "625 g", 
                newPrice: "1 149 €",
                usedPrice: "Dès 980 €",
                usedState: "Très bon état",
                historyLabels: ['Jan', 'Fév', 'Mar', 'Avr'],
                priceHistory: [1199, 1169, 1149, 1149],
                minPrice: "1 149 € (Mar)",
                maxPrice: "1 199 € (Jan)"
            }
        ];

        const tableBody = document.getElementById('lensTableBody');
        const searchInput = document.getElementById('searchInput');
        
        let currentType = 'all';
        let currentBrand = 'all';

        function displayLenses(data) {
            tableBody.innerHTML = '';
            if (data.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="11" class="p-6 text-center text-gray-500">Aucun objectif trouvé</td></tr>`;
                return;
            }
            
            data.forEach((lens, index) => {
                const row = document.createElement('tr');
                row.className = "hover:bg-gray-800/50 transition";
                row.innerHTML = `
                    <td class="p-4">
                        <div class="font-medium text-white">${lens.name}</div>
                        <div class="text-xs text-gray-400 font-mono mt-0.5">${lens.ref}</div>
                    </td>
                    <td class="p-4">
                        <span class="px-2.5 py-1 text-xs rounded-full font-medium ${lens.brand === 'Sony' ? 'bg-orange-500/10 text-orange-400 border border-orange-500/20' : lens.brand === 'Sigma' ? 'bg-red-500/10 text-red-400 border border-red-500/20' : 'bg-purple-500/10 text-purple-400 border border-purple-500/20'}">${lens.brand}</span>
                    </td>
                    <td class="p-4"><span class="px-2.5 py-1 text-xs rounded-full ${lens.type === 'zoom' ? 'bg-gray-800 text-gray-300' : 'bg-gray-800 text-gray-300'}">${lens.type === 'zoom' ? 'Zoom' : 'Fixe'}</span></td>
                    <td class="p-4"><span class="px-2 py-0.5 text-xs bg-gray-800 text-gray-300 rounded font-mono">${lens.mount}</span></td>
                    <td class="p-4 text-gray-300 text-xs">${lens.sensor}</td>
                    <td class="p-4 text-gray-300 font-medium">${lens.aperture}</td>
                    <td class="p-4 text-gray-300 text-xs">${lens.weight}</td>
                    <td class="p-4 font-semibold text-orange-400">${lens.newPrice}</td>
                    <td class="p-4">
                        <div class="text-sky-400 font-medium">${lens.usedPrice}</div>
                        <div class="text-[11px] text-gray-400">${lens.usedState}</div>
                    </td>
                    <td class="p-4">
                        <div class="flex items-center gap-3">
                            <div class="w-28 h-12">
                                <canvas id="chart-${index}"></canvas>
                            </div>
                            <div class="text-xs space-y-0.5 whitespace-nowrap">
                                <div class="text-emerald-400">Min: <span class="font-medium">${lens.minPrice}</span></div>
                                <div class="text-rose-400">Max: <span class="font-medium">${lens.maxPrice}</span></div>
                            </div>
                        </div>
                    </td>
                    <td class="p-4 text-right">
                        <button onclick="alert('Détails prix pour ${lens.name}')" class="px-3 py-1.5 bg-gray-800 hover:bg-orange-600 hover:text-white rounded-lg transition text-xs font-medium">Prix</button>
                    </td>
                `;
                tableBody.appendChild(row);

                // Génération du mini-graphique
                setTimeout(() => {
                    const ctx = document.getElementById(`chart-${index}`).getContext('2d');
                    new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: lens.historyLabels,
                            datasets: [{
                                data: lens.priceHistory,
                                borderColor: '#f97316',
                                borderWidth: 2,
                                pointRadius: 2,
                                pointBackgroundColor: '#f97316',
                                tension: 0.3,
                                fill: true,
                                backgroundColor: 'rgba(249, 115, 22, 0.05)'
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: { 
                                legend: { display: false }, 
                                tooltip: { 
                                    enabled: true,
                                    callbacks: {
                                        title: function(context) { return 'Mois : ' + context[0].label; },
                                        label: function(context) { return ' Prix : ' + context.raw + ' €'; }
                                    }
                                } 
                            },
                            scales: {
                                x: { display: false },
                                y: { display: false }
                            }
                        }
                    });
                }, 0);
            });
        }

        // Gestion des filtres de type
        window.filterType = function(type) {
            currentType = type;
            document.querySelectorAll('[id^="btn-type-"]').forEach(btn => {
                btn.className = "px-3 py-1.5 text-xs text-gray-300 hover:text-white rounded-md transition";
            });
            document.getElementById(`btn-type-${type}`).className = "px-3 py-1.5 text-xs bg-gray-800 text-white rounded-md transition font-medium";
            applyFilters();
        }

        // Gestion des filtres de marque
        window.filterBrand = function(brand) {
            currentBrand = brand;
            document.querySelectorAll('[id^="btn-brand-"]').forEach(btn => {
                btn.className = "px-3 py-1.5 text-xs text-gray-300 hover:text-white rounded-md transition";
            });
            document.getElementById(`btn-brand-${brand}`).className = "px-3 py-1.5 text-xs bg-gray-800 text-white rounded-md transition font-medium";
            applyFilters();
        }

        // Application combinée de tous les filtres (Recherche + Type + Marque)
        function applyFilters() {
            const query = searchInput.value.toLowerCase();
            const filtered = lenses.filter(lens => {
                const matchesType = currentType === 'all' || lens.type === currentType;
                const matchesBrand = currentBrand === 'all' || lens.brand === currentBrand;
                const matchesQuery = lens.name.toLowerCase().includes(query) || 
                                     lens.ref.toLowerCase().includes(query) || 
                                     lens.mount.toLowerCase().includes(query) || 
                                     lens.sensor.toLowerCase().includes(query) ||
                                     lens.brand.toLowerCase().includes(query);
                return matchesType && matchesBrand && matchesQuery;
            });
            displayLenses(filtered);
        }

        searchInput.addEventListener('input', applyFilters);

        // Affichage initial
        displayLenses(lenses);
    </script>
</body>
</html>
