<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SonyLensPrice - Comparateur d'objectifs photo Sony</title>
    <!-- Tailwind CSS pour un design rapide et professionnel -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-sans">

    <!-- En-tête -->
    <header class="border-b border-gray-800 bg-gray-900/50 backdrop-blur sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-tight text-orange-500">SonyLens<span class="text-white">Price</span></h1>
            <span class="text-sm text-gray-400">Le comparateur des optiques Sony E / FE</span>
        </div>
    </header>

    <!-- Contenu principal -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        
        <!-- Barre de recherche et filtres -->
        <div class="mb-8 flex flex-col sm:flex-row gap-4 justify-between items-center">
            <div class="w-full sm:w-96">
                <input type="text" id="searchInput" placeholder="Rechercher un objectif (ex: SEL2470GM2, 50mm)..." 
                    class="w-full bg-gray-900 border border-gray-800 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-orange-500 transition">
            </div>
            <div class="flex gap-2 w-full sm:w-auto">
                <button onclick="filterType('all')" class="px-4 py-2 text-sm bg-gray-800 hover:bg-gray-700 rounded-lg transition font-medium">Tous</button>
                <button onclick="filterType('zoom')" class="px-4 py-2 text-sm bg-gray-900 border border-gray-800 hover:bg-gray-800 rounded-lg transition text-gray-300">Zooms</button>
                <button onclick="filterType('prime')" class="px-4 py-2 text-sm bg-gray-900 border border-gray-800 hover:bg-gray-800 rounded-lg transition text-gray-300">Focales fixes</button>
            </div>
        </div>

        <!-- Tableau des objectifs -->
        <div class="bg-gray-900 border border-gray-800 rounded-xl overflow-hidden shadow-xl">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-gray-800 text-xs uppercase tracking-wider text-gray-400 bg-gray-900/80">
                            <th class="p-4">Nom officiel (Réf. Sony)</th>
                            <th class="p-4">Type</th>
                            <th class="p-4">Ouverture</th>
                            <th class="p-4">Poids</th>
                            <th class="p-4">Prix indicatif</th>
                            <th class="p-4 text-right">Action</th>
                        </tr>
                    </thead>
                    <tbody id="lensTableBody" class="divide-y divide-gray-800 text-sm">
                        <!-- Les lignes seront injectées par JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- Script de gestion des données -->
    <script>
        const lenses = [
            { 
                name: "Sony FE 24-70mm f/2.8 GM II", 
                ref: "SEL2470GM2",
                type: "zoom", 
                aperture: "f/2.8", 
                weight: "695 g", 
                price: "2 299 €" 
            },
            { 
                name: "Sony FE 50mm f/1.4 GM", 
                ref: "SEL50F14GM",
                type: "prime", 
                aperture: "f/1.4", 
                weight: "516 g", 
                price: "1 599 €" 
            },
            { 
                name: "Sony FE 70-200mm f/2.8 GM OSS II", 
                ref: "SEL70200GM2",
                type: "zoom", 
                aperture: "f/2.8", 
                weight: "1 045 g", 
                price: "2 999 €" 
            },
            { 
                name: "Sony FE 35mm f/1.8", 
                ref: "SEL35F18",
                type: "prime", 
                aperture: "f/1.8", 
                weight: "281 g", 
                price: "599 €" 
            },
            { 
                name: "Sony FE 200-600mm f/5.6-6.3 G OSS", 
                ref: "SEL200600G",
                type: "zoom", 
                aperture: "f/5.6-6.3", 
                weight: "2 115 g", 
                price: "1 999 €" 
            }
        ];

        const tableBody = document.getElementById('lensTableBody');
        const searchInput = document.getElementById('searchInput');
        let currentType = 'all';

        function displayLenses(data) {
            tableBody.innerHTML = '';
            if (data.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-gray-500">Aucun objectif trouvé</td></tr>`;
                return;
            }
            
            data.forEach(lens => {
                const row = document.createElement('tr');
                row.className = "hover:bg-gray-800/50 transition";
                row.innerHTML = `
                    <td class="p-4">
                        <div class="font-medium text-white">${lens.name}</div>
                        <div class="text-xs text-gray-400 font-mono mt-0.5">Réf : ${lens.ref}</div>
                    </td>
                    <td class="p-4"><span class="px-2.5 py-1 text-xs rounded-full ${lens.type === 'zoom' ? 'bg-orange-500/10 text-orange-400 border border-orange-500/20' : 'bg-blue-500/10 text-blue-400 border border-blue-500/20'}">${lens.type === 'zoom' ? 'Zoom' : 'Focale fixe'}</span></td>
                    <td class="p-4 text-gray-300">${lens.aperture}</td>
                    <td class="p-4 text-gray-300">${lens.weight}</td>
                    <td class="p-4 font-semibold text-orange-400">${lens.price}</td>
                    <td class="p-4 text-right">
                        <button onclick="alert('Bientôt : Comparatif des prix marchands pour ${lens.name}')" class="px-3 py-1.5 bg-gray-800 hover:bg-orange-600 hover:text-white rounded-lg transition text-xs font-medium">Voir les prix</button>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }

        window.filterType = function(type) {
            currentType = type;
            applyFilters();
        }

        function applyFilters() {
            const query = searchInput.value.toLowerCase();
            const filtered = lenses.filter(lens => {
                const matchesType = currentType === 'all' || lens.type === currentType;
                const matchesQuery = lens.name.toLowerCase().includes(query) || lens.ref.toLowerCase().includes(query);
                return matchesType && matchesQuery;
            });
            displayLenses(filtered);
        }

        searchInput.addEventListener('input', applyFilters);

        displayLenses(lenses);
    </script>
</body>
</html>
