<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SonyLensPrice - Comparateur d'objectifs photo Sony</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-sans">

    <!-- En-tête -->
    <header class="border-b border-gray-800 bg-gray-900/50 backdrop-blur sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-tight text-orange-500">SonyLens<span class="text-white">Price</span></h1>
            <span class="text-sm text-gray-400">Le comparateur des optiques Sony E / FE / A</span>
        </div>
    </header>

    <!-- Contenu principal -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        
        <!-- Barre de recherche et filtres -->
        <div class="mb-8 flex flex-col sm:flex-row gap-4 justify-between items-center">
            <div class="w-full sm:w-96">
                <input type="text" id="searchInput" placeholder="Rechercher (ex: SEL2470GM2, FE, Full-frame)..." 
                    class="w-full bg-gray-900 border border-gray-800 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-orange-500 transition">
            </div>
            <div class="flex gap-2 w-full sm:w-auto">
                <button onclick="filterType('all')" class="px-4 py-2 text-sm bg-gray-800 hover:bg-gray-700 rounded-lg transition font-medium">Tous</button>
                <button onclick="filterType('zoom')" class="px-4 py-2 text-sm bg-gray-900 border border-gray-800 hover:bg-gray-800 rounded-lg transition text-gray-300">Zooms</button>
                <button onclick="filterType('prime')" class="px-4 py-2 text-sm bg-gray-900 border border-gray-800 hover:bg-gray-800 rounded-lg transition text-gray-300">Focales fixes</button>
            </div>
        </div>

        <!-- Tableau des objectifs -->
        <div class="bg-gray-900 border border-gray-800 rounded-xl overflow-hidden shadow-xl">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-gray-800 text-xs uppercase tracking-wider text-gray-400 bg-gray-900/80">
                            <th class="p-4">Objectif (Réf.)</th>
                            <th class="p-4">Type</th>
                            <th class="p-4">Monture</th>
                            <th class="p-4">Capteur</th>
                            <th class="p-4">Ouverture</th>
                            <th class="p-4">Poids</th>
                            <th class="p-4">Neuf</th>
                            <th class="p-4">Occasion</th>
                            <th class="p-4 w-64">Price History (Min / Max)</th>
                            <th class="p-4 text-right">Action</th>
                        </tr>
                    </thead>
                    <tbody id="lensTableBody" class="divide-y divide-gray-800 text-sm">
                        <!-- Les lignes seront injectées par JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- Script de gestion des données et des graphiques -->
    <script>
        const lenses = [
            { 
                name: "Sony FE 24-70mm f/2.8 GM II", 
                ref: "SEL2470GM2",
                type: "zoom", 
                mount: "FE",
                sensor: "Full-frame",
                aperture: "f/2.8", 
                weight: "695 g", 
                newPrice: "2 299 €",
                usedPrice: "Dès 1 989 €",
                usedState: "Très bon état",
                historyLabels: ['Jan', 'Fév', 'Mar', 'Avr'],
                priceHistory: [2499, 2399, 2350, 2299],
                minPrice: "2 299 € (Avr)",
                maxPrice: "2 499 € (Jan)"
            },
            { 
                name: "Sony FE 50mm f/1.4 GM", 
                ref: "SEL50F14GM",
                type: "prime", 
                mount: "FE",
                sensor: "Full-frame",
                aperture: "f/1.4", 
                weight: "516 g", 
                newPrice: "1 599 €",
                usedPrice: "Dès 1 390 €",
                usedState: "Comme neuf",
                historyLabels: ['Jan', 'Fév', 'Mar', 'Avr'],
                priceHistory: [1699, 1649, 1599, 1599],
                minPrice: "1 599 € (Mar)",
                maxPrice: "1 699 € (Jan)"
            },
            { 
                name: "Sony FE 70-200mm f/2.8 GM OSS II", 
                ref: "SEL70200GM2",
                type: "zoom", 
                mount: "FE",
                sensor: "Full-frame",
                aperture: "f/2.8", 
                weight: "1 045 g", 
                newPrice: "2 999 €",
                usedPrice: "Dès 2 650 €",
                usedState: "Bon état",
                historyLabels: ['Jan', 'Fév', 'Mar', 'Avr'],
                priceHistory: [3099, 2999, 2999, 2999],
                minPrice: "2 999 € (Fév)",
                maxPrice: "3 099 € (Jan)"
            },
            { 
                name: "Sony E 35mm f/1.8 OSS", 
                ref: "SEL35F18",
                type: "prime", 
                mount: "E",
                sensor: "APS-C",
                aperture: "f/1.8", 
                weight: "154 g", 
                newPrice: "449 €",
                usedPrice: "Dès 320 €",
                usedState: "État acceptable",
                historyLabels: ['Jan', 'Fév', 'Mar', 'Avr'],
                priceHistory: [480, 460, 450, 449],
                minPrice: "449 € (Avr)",
                maxPrice: "480 € (Jan)"
            },
            { 
                name: "Sony FE 200-600mm f/5.6-6.3 G OSS", 
                ref: "SEL200600G",
                type: "zoom", 
                mount: "FE",
                sensor: "Full-frame",
                aperture: "f/5.6-6.3", 
                weight: "2 115 g", 
                newPrice: "1 999 €",
                usedPrice: "Dès 1 740 €",
                usedState: "Comme neuf",
                historyLabels: ['Jan', 'Fév', 'Mar', 'Avr'],
                priceHistory: [1899, 1949, 1999, 1999],
                minPrice: "1 899 € (Jan)",
                maxPrice: "1 999 € (Mar)"
            }
        ];

        const tableBody = document.getElementById('lensTableBody');
        const searchInput = document.getElementById('searchInput');
        let currentType = 'all';

        function displayLenses(data) {
            tableBody.innerHTML = '';
            if (data.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="10" class="p-6 text-center text-gray-500">Aucun objectif trouvé</td></tr>`;
                return;
            }
            
            data.forEach((lens, index) => {
                const row = document.createElement('tr');
                row.className = "hover:bg-gray-800/50 transition";
                row.innerHTML = `
                    <td class="p-4">
                        <div class="font-medium text-white">${lens.name}</div>
                        <div class="text-xs text-gray-400 font-mono mt-0.5">${lens.ref}</div>
                    </td>
                    <td class="p-4"><span class="px-2.5 py-1 text-xs rounded-full ${lens.type === 'zoom' ? 'bg-orange-500/10 text-orange-400 border border-orange-500/20' : 'bg-blue-500/10 text-blue-400 border border-blue-500/20'}">${lens.type === 'zoom' ? 'Zoom' : 'Fixe'}</span></td>
                    <td class="p-4"><span class="px-2 py-0.5 text-xs bg-gray-800 text-gray-300 rounded font-mono">${lens.mount}</span></td>
                    <td class="p-4 text-gray-300 text-xs">${lens.sensor}</td>
                    <td class="p-4 text-gray-300 font-medium">${lens.aperture}</td>
                    <td class="p-4 text-gray-300 text-xs">${lens.weight}</td>
                    <td class="p-4 font-semibold text-orange-400">${lens.newPrice}</td>
                    <td class="p-4">
                        <div class="text-sky-400 font-medium">${lens.usedPrice}</div>
                        <div class="text-[11px] text-gray-400">${lens.usedState}</div>
                    </td>
                    <td class="p-4">
                        <div class="flex items-center gap-3">
                            <div class="w-28 h-12">
                                <canvas id="chart-${index}"></canvas>
                            </div>
                            <div class="text-xs space-y-0.5 whitespace-nowrap">
                                <div class="text-emerald-400">Min: <span class="font-medium">${lens.minPrice}</span></div>
                                <div class="text-rose-400">Max: <span class="font-medium">${lens.maxPrice}</span></div>
                            </div>
                        </div>
                    </td>
                    <td class="p-4 text-right">
                        <button onclick="alert('Détails prix pour ${lens.name}')" class="px-3 py-1.5 bg-gray-800 hover:bg-orange-600 hover:text-white rounded-lg transition text-xs font-medium">Prix</button>
                    </td>
                `;
                tableBody.appendChild(row);

                // Génération du mini-graphique
                setTimeout(() => {
                    const ctx = document.getElementById(`chart-${index}`).getContext('2d');
                    new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: lens.historyLabels,
                            datasets: [{
                                data: lens.priceHistory,
                                borderColor: '#f97316',
                                borderWidth: 2,
                                pointRadius: 2,
                                pointBackgroundColor: '#f97316',
                                tension: 0.3,
                                fill: true,
                                backgroundColor: 'rgba(249, 115, 22, 0.05)'
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: { 
                                legend: { display: false }, 
                                tooltip: { 
                                    enabled: true,
                                    callbacks: {
                                        title: function(context) { return 'Mois : ' + context[0].label; },
                                        label: function(context) { return ' Prix : ' + context.raw + ' €'; }
                                    }
                                } 
                            },
                            scales: {
                                x: { display: false },
                                y: { display: false }
                            }
                        }
                    });
                }, 0);
            });
        }

        window.filterType = function(type) {
            currentType = type;
            applyFilters();
        }

        function applyFilters() {
            const query = searchInput.value.toLowerCase();
            const filtered = lenses.filter(lens => {
                const matchesType = currentType === 'all' || lens.type === currentType;
                const matchesQuery = lens.name.toLowerCase().includes(query) || 
                                     lens.ref.toLowerCase().includes(query) || 
                                     lens.mount.toLowerCase().includes(query) || 
                                     lens.sensor.toLowerCase().includes(query);
                return matchesType && matchesQuery;
            });
            displayLenses(filtered);
        }

        searchInput.addEventListener('input', applyFilters);

        displayLenses(lenses);
    </script>
</body>
</html>
