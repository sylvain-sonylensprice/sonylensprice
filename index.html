<!DOCTYPE html>
<html lang="fr">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body class="bg-gray-950 text-gray-100 min-h-screen font-sans">

    <header class="border-b border-gray-800 bg-gray-900/50 backdrop-blur sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-tight text-orange-500">SonyLens<span class="text-white">Price</span></h1>
            <span class="text-sm text-gray-400">Le comparateur des optiques Sony & Montures E tierces</span>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        
        <div class="mb-8 flex flex-col lg:flex-row gap-4 justify-between items-center">
            <div class="w-full lg:w-80">
                <input type="text" id="searchInput" placeholder="Rechercher (ex: Sigma, Tamron, SEL2470)..." 
                    class="w-full bg-gray-900 border border-gray-800 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-orange-500 transition">
            </div>
            
            <div class="flex flex-wrap gap-4 w-full lg:w-auto justify-between lg:justify-end items-center">
                <div class="flex gap-1.5 bg-gray-900 p-1 border border-gray-800 rounded-lg">
                    <button onclick="filterType('all')" id="btn-type-all" class="px-3 py-1.5 text-xs bg-gray-800 text-white rounded-md transition font-medium">Tous types</button>
                    <button onclick="filterType('zoom')" id="btn-type-zoom" class="px-3 py-1.5 text-xs text-gray-300 hover:text-white rounded-md transition">Zooms</button>
                    <button onclick="filterType('prime')" id="btn-type-prime" class="px-3 py-1.5 text-xs text-gray-300 hover:text-white rounded-md transition">Fixes</button>
                </div>

                <div class="flex items-center gap-3 bg-gray-900 px-3 py-1.5 border border-gray-800 rounded-lg text-xs">
                    <span class="text-gray-400 font-medium">Marques :</span>
                    <label class="flex items-center gap-1.5 cursor-pointer text-gray-200">
                        <input type="checkbox" value="Sony" checked onchange="applyFilters()" class="rounded bg-gray-800 border-gray-700 text-orange-500 focus:ring-0"> Sony
                    </label>
                    <label class="flex items-center gap-1.5 cursor-pointer text-gray-200">
                        <input type="checkbox" value="Sigma" checked onchange="applyFilters()" class="rounded bg-gray-800 border-gray-700 text-orange-500 focus:ring-0"> Sigma
                    </label>
                    <label class="flex items-center gap-1.5 cursor-pointer text-gray-200">
                        <input type="checkbox" value="Tamron" checked onchange="applyFilters()" class="rounded bg-gray-800 border-gray-700 text-orange-500 focus:ring-0"> Tamron
                    </label>
                </div>
            </div>
        </div>

        <div class="bg-gray-900 border border-gray-800 rounded-xl overflow-hidden shadow-xl">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-gray-800 text-xs uppercase tracking-wider text-gray-400 bg-gray-900/80">
                            <th class="p-4">Objectif (Réf.)</th>
                            <th class="p-4">Marque</th>
                            <th class="p-4">Type</th>
                            <th class="p-4">Monture</th>
                            <th class="p-4">Capteur</th>
                            <th class="p-4">Ouverture</th>
                            <th class="p-4">Poids</th>
                            <th class="p-4">Neuf</th>
                            <th class="p-4">Occasion</th>
                            <th class="p-4 w-64">Price History (Min / Max)</th>
                            <th class="p-4 text-right">Action</th>
                        </tr>
                    </thead>
                    <tbody id="lensTableBody" class="divide-y divide-gray-800 text-sm">
                        </tbody>
                </table>
            </div>
        </div>
